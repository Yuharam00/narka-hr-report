<style>
:root{--bg:#FAFAF8;--surface:#FFFFFF;--text:#202020;--text-2:#737373;--text-3:#A3A3A0;--border:#E8E8E5;--error:#C93A3A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
body{display:flex;flex-direction:column}
.bar{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--border)}
.bar .in{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:24px;height:52px}
.brand{font-family:"Inter",sans-serif;font-weight:600;font-size:15px;white-space:nowrap}
.brand span{font-family:inherit;font-weight:400;font-size:12.5px;color:var(--text-2);margin-left:8px}
nav{display:flex;gap:2px;height:100%;overflow-x:auto;scrollbar-width:none;flex:1}
nav button{appearance:none;border:0;background:none;font:inherit;font-size:14px;color:var(--text-2);padding:0 12px;height:100%;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .18s,border-color .18s}
nav button .n{font-family:"Inter",sans-serif;font-size:11.5px;color:var(--text-3);margin-right:7px}
nav button:hover{color:var(--text)}
nav button[aria-selected="true"]{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
nav button:focus-visible{outline:2px solid var(--text);outline-offset:-4px}
.mode{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:4px;font:inherit;font-size:12px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.mode:hover{color:var(--text)} .mode[hidden]{display:none}
.conf{font-size:11.5px;color:var(--error);border:1px solid currentColor;border-radius:4px;padding:2px 8px;white-space:nowrap}
.views{flex:1 1 auto;position:relative}
.views iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.views iframe[hidden]{display:none}
@media(max-width:720px){.bar .in{padding:0 12px;gap:12px}.brand span,.conf{display:none}nav button{padding:0 8px;font-size:13.5px}}
@media print{.bar{display:none}}
</style>

  function load(id){
    var f=document.getElementById(id);if(f.dataset.ok)return;
    var bin=atob(SRC[id]),u=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    var html=new TextDecoder('utf-8').decode(u);
    /* 상단 공통 메뉴와 겹치는 중간보고 자체 머리글만 화면에서 숨김(본문 내용은 그대로) */
    if(id==='v-mid'){
      var inj='<style>header.top{display:none!important}</style>'+
        '<script>addEventListener("message",function(e){if(e.data==="narka-theme"){var b=document.getElementById("themeBtn");if(b)b.click();}});<\/script>';
      html=html.replace('</head>',inj+'</head>');
    }
    f.src=URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));
    f.dataset.ok="1";
  }
  /* 중간보고의 화면 모드 기능은 상단 공통 메뉴 버튼으로 이동 */
  var mode=document.getElementById('modeBtn');
  mode.addEventListener('click',function(){
    var w=document.getElementById('v-mid').contentWindow;if(w)w.postMessage('narka-theme','*');
  });
  var tabs=[].slice.call(document.querySelectorAll('nav button'));
  function show(i,push){
    tabs.forEach(function(t,j){
      var on=i===j,v=t.getAttribute('aria-controls');
      t.setAttribute('aria-selected',on);document.getElementById(v).hidden=!on;
      if(on)load(v);
    });
    mode.hidden=tabs[i].getAttribute('aria-controls')!=='v-mid';
    if(push)history.replaceState(null,'','#'+tabs[i].dataset.h);
  }
  tabs.forEach(function(t,i){
    t.addEventListener('click',function(){show(i,true)});
    t.addEventListener('keydown',function(e){
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){var n=(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[n].focus();show(n,true);}
    });
  });
  var h=location.hash.slice(1),k=tabs.findIndex(function(t){return t.dataset.h===h});
  show(k<0?0:k,false);
})();
